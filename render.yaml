services:
  - type: web
    name: delta-bypass-api
    env: node
    repo: https://github.com/yourusername/bypass
    buildCommand: npm install --prefix backend
    startCommand: npm start --prefix backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /api/health

  - type: web
    name: delta-bypass-frontend
    env: static
    repo: https://github.com/yourusername/bypass
    buildCommand: npm install --prefix frontend
    staticPublishPath: ./frontend/public
    envVars:
      - key: NODE_ENV
        value: production
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
